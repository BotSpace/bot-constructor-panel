  /api/chat/users/{projectId}/:
    get:
      operationId: apiChatUsersRetrieve
      description: "\n        Project uchun barcha userlarni olish, har bir user uchun:\n\
        \        - Oxirgi 1 ta xabar\n        - O'qilmagan xabarlar soni\n       \
        \ - Jami xabarlar soni\n        \n        Userlar oxirgi xabar vaqti bo'yicha\
        \ tartiblangan (eng yangi xabar tepada).\n        Pagination qo'llab-quvvatlanadi\
        \ (limit va skip parametrlari).\n        "
      summary: Userlar va ularning xabarlarini olish
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
        description: Qaytariladigan userlar soni
      - in: path
        name: projectId
        schema:
          type: integer
        description: Project ID
        required: true
      - in: query
        name: skip
        schema:
          type: integer
          default: 0
        description: O'tkazib yuborilgan userlar soni (pagination)
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UsersListResponse'
                required:
                - status
                - data
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
