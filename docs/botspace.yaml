openapi: 3.0.3
info:
  title: Your Project API
  version: 1.0.0
  description: Your project description
paths:
  /api/bot-webhook/{method}/{uuid}/:
    post:
      operationId: apiBotWebhookCreate
      parameters:
      - in: path
        name: method
        schema:
          type: string
        required: true
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/chat/mark-read/{projectId}/:
    post:
      operationId: apiChatMarkReadCreate
      description: "\n        Userning xabarlarini o'qilgan deb belgilash.\n     \
        \   \n        - Agar message_ids berilsa, faqat shu xabarlar o'qilgan bo'ladi\n\
        \        - Agar message_ids berilmasa, userning barcha xabarlari o'qilgan\
        \ bo'ladi\n        "
      summary: Xabarlarni o'qilgan deb belgilash
      parameters:
      - in: path
        name: projectId
        schema:
          type: integer
        description: Project ID
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAsReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkAsReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkAsReadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MarkAsReadResponse'
                required:
                - status
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/chat/messages/{projectId}/{chatId}/:
    get:
      operationId: apiChatMessagesRetrieve
      description: "\n        Bitta user (chat_id) uchun barcha xabarlarni olish.\n\
        \        Pagination bilan qo'llab-quvvatlanadi.\n        "
      summary: Bitta user uchun barcha xabarlarni olish
      parameters:
      - in: path
        name: chatId
        schema:
          type: string
        description: Telegram chat ID
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
        description: Qaytariladigan xabarlar soni
      - in: path
        name: projectId
        schema:
          type: integer
        description: Project ID
        required: true
      - in: query
        name: skip
        schema:
          type: integer
          default: 0
        description: O'tkazib yuborilgan xabarlar soni
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MessagesListResponse'
                required:
                - status
                - data
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/chat/send-message/{projectId}/:
    post:
      operationId: apiChatSendMessageCreate
      description: "\n        Bitta foydalanuvchiga xabar yuborish (matn va media).\n\
        \        Yuborilgan xabar avtomatik ravishda chatga qo'shiladi va real-time\
        \ stream orqali boshqa clientlarga yuboriladi.\n        \n        **Media\
        \ yuborish:**\n        - photo: max 10MB\n        - video: max 50MB\n    \
        \    - audio: max 50MB\n        - document: max 50MB\n        \n        **Telegram\
        \ API limitlari:**\n        - 1 ta botga 30 xabar/soniya\n        - 1 ta chatga\
        \ 1 xabar/soniya\n        - Bu limitlar avtomatik kuzatiladi\n        "
      summary: Foydalanuvchiga xabar yuborish
      parameters:
      - in: path
        name: projectId
        schema:
          type: integer
        description: Project ID
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SendMessageResponse'
                required:
                - status
                - data
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/chat/stats/{projectId}/:
    get:
      operationId: apiChatStatsRetrieve
      description: "\n        Project uchun chat statistikasi:\n        - Jami userlar\
        \ soni\n        - Jami xabarlar soni  \n        - O'qilmagan xabarlar soni\n\
        \        - O'qilgan xabarlar soni\n        "
