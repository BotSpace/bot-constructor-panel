components:
  schemas:
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8
      required:
      - new_password
      - old_password
    ChatStatsResponse:
      type: object
      description: Chat statistikasi response
      properties:
        total_users:
          type: integer
          description: Jami userlar soni
        total_messages:
          type: integer
          description: Jami xabarlar soni
        unread_messages:
          type: integer
          description: O'qilmagan xabarlar soni
        read_messages:
          type: integer
          description: O'qilgan xabarlar soni
      required:
      - read_messages
      - total_messages
      - total_users
      - unread_messages
    Confirm:
      type: object
      properties:
        code:
          type: string
          maxLength: 4
          minLength: 4
        phone:
          type: string
          maxLength: 255
      required:
      - code
      - phone
    CreateCollection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        project:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CreateField'
      required:
      - id
      - name
      - project
    CreateDebug:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          enum:
          - pending
          - initializing
          - running
          - stopped
          - stopping
          - failed
          - suspended
          type: string
          description: |-
            * `pending` - pending
            * `initializing` - initializing
            * `running` - running
            * `stopped` - stopped
            * `stopping` - stopping
            * `failed` - failed
            * `suspended` - suspended
          x-spec-enum-id: 55424add8a8b4799
        service_id:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    CreateEnviroment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          title: Name
          maxLength: 255
        value:
          type: string
          maxLength: 255
        project:
          type: integer
      required:
      - id
      - key
      - project
      - value
    CreateField:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          enum:
          - text
          - number
          - bool
          - datetime
          - file
          - audio
          - video
          - photo
          - relation
          type: string
          description: |-
            * `text` - Text
            * `number` - Number
            * `bool` - bool
            * `datetime` - datetime
            * `file` - file
            * `audio` - audio
            * `video` - video
            * `photo` - photo
            * `relation` - Relation
          x-spec-enum-id: 85ed391b3254a087
          title: Name
        required:
          type: boolean
        default:
          type: string
          nullable: true
          maxLength: 255
        relation_collection:
          type: integer
          nullable: true
          description: Referenced collection for RELATION type fields
      required:
      - id
      - name
