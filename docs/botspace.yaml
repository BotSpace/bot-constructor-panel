                    - project is required
          description: project parametri yo'q
    post:
      operationId: apiRelaseCreate
      description: |-
        Loyiha uchun yangi release yaratadi va uni deploy qiladi.

        **Tarif qoidalari:**
        - **Birinchi release** — `plan_id` majburiy:
          - Agar siz hech qaysi loyihangizda FREE plan bilan release qilmagan bo'lsangiz → FREE yoki pulli plan tanlash mumkin.
          - Agar siz biror loyihangizda FREE plan bilan allaqachon release qilgan bo'lsangiz → pulli tarif tanlash **majburiy**.
          - Pulli tarif tanlanganda balansdan bir martalik to'lov yechiladi va plan loyihaga biriktiriladi.

        - **Keyingi releaselar** — `plan_id` talab qilinmaydi. Plan allaqachon loyihaga biriktirilgan, oylik to'lov avtomatik yechib turiladi.

        **Versiya** avtomatik oshiriladi.
      summary: Yangi release yaratish
      tags:
      - relase
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelase'
            examples:
              BirinchiRelease(FREETarif):
                value:
                  project: 1
                  plan_id: 1
                summary: Birinchi release (FREE tarif)
                description: Birinchi marta release qilish — FREE tarif tanlangan
                  holda
              BirinchiRelease(pulliTarif):
                value:
                  project: 1
                  plan_id: 2
                summary: Birinchi release (pulli tarif)
                description: Birinchi marta release qilish — pulli tarif tanlangan
                  holda (balansdan yechiladi)
              KeyingiRelease:
                value:
                  project: 1
                summary: Keyingi release
                description: Loyihada allaqachon release bor — plan_id talab qilinmaydi
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateRelase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRelase'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
