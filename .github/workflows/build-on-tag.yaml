name: Build and Push on Tag

on:
  push:
    tags:
      - "*"

env:
  PROJECT_NAME: botmother-constructor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env
        run: |
          cp .env.example .env

      - name: Update env
        run: |
          update_env() {
              local env_file=".env"
              cp .env.example "$env_file"

              for kv in "$@"; do
                  local key="${kv%%=*}"
                  local value="${kv#*=}"
                  sed -i "s|^$key=.*|$key=$value|" "$env_file"
              done
          }

          update_env \
            "NEXTAUTH_SECRET=${{ secrets.NEXT_SECRET }}" \
            "NEXT_PUBLIC_API=${{ secrets.API_URL }}"

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ vars.DOCKER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ steps.tag.outputs.TAG }}
          no-cache: true

      - name: Success message
        run: |
          echo "✅ Successfully built and pushed image with tags:"
          echo "  - ${{ steps.tag.outputs.TAG }}"
          echo "  - latest"
