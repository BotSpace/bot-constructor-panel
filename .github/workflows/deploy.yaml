name: Build and Push Docker Image (tag + latest)

on:
  push:
    tags:
      - "*-prod"
      - "*-dev"

env:
  PROJECT_NAME: botmother-constructor

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=${{ secrets.NEXT_SECRET }}|" .env
          sed -i "s|^NEXT_PUBLIC_API=.*|NEXT_PUBLIC_API=${{ secrets.API_URL }}|" .env
          sed -i "s|^NEXT_PUBLIC_AGENT_API=.*|NEXT_PUBLIC_AGENT_API=https://api.botspace.uz/api/agentv2|" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest
